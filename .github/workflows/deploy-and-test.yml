name: Cloud CI Forensic Tests & Live GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cloud-verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Automated Forensic Engine, MCP & Kiro Spec Test Suite
        run: node --test tests/forensic-engines.test.mjs

      - name: Install Web Workbench Dependencies
        working-directory: web
        run: npm install

      - name: Strict TypeScript Check & Production Vite Build
        working-directory: web
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: cloud-verify-and-build
    steps:
      - name: Deploy PhantomGlass to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
